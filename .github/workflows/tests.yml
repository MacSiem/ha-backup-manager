name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check ha-backup-manager.js
      - name: Verify dependency-free frequency chart
        run: node tests/frequency_chart_smoke.cjs
